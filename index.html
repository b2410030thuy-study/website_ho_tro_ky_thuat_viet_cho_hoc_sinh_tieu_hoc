<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light">
<title>Bé Vui Học Viết – Luyện chữ lớp 1</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--p:#ff8fab;--b:#8ecae6;--y:#ffd166;--g:#95d5b2;--t:#33415c}*{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:18px/1.4 system-ui,sans-serif;background:#fff9f0;color:var(--t)}body.tch{background:#f4f6fa;font-size:15px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--b)}.tch header{background:#243b53;color:#fff}
nav{display:flex;flex-wrap:wrap;gap:6px;flex:1}button{font:inherit;border:0;border-radius:14px;padding:9px 14px;background:var(--y);cursor:pointer;color:#333;margin:2px}
nav button{background:#ffffffaa}.tch nav button{background:#ffffff26;color:#fff}.big{font-size:24px;padding:14px 26px}
main{max-width:1100px;margin:auto;padding:16px}.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 3px 10px #0001;margin-bottom:14px}.tch .card{border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}.tile{font-size:42px;text-align:center;padding:12px 4px;border-radius:18px;background:#fff;border:3px solid var(--b);cursor:pointer}
.tile small{display:block;font-size:13px}.tile.done{border-color:var(--g);background:#e9f9ef}.wf{font-family:WF}
input,select,textarea{font:inherit;padding:8px;border:2px solid #ccd;border-radius:10px;width:100%}label{display:block;font-size:.85em}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #e3e6ee;text-align:left}.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.video{aspect-ratio:16/9;width:100%;border:0;border-radius:14px}#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#333;color:#fff;padding:12px 20px;border-radius:14px;display:none;z-index:9}
.av{font-size:1.4em}img.av{width:1.6em;height:1.6em;border-radius:50%;object-fit:cover;vertical-align:middle}.bar{background:#e3e6ee;border-radius:8px;height:10px;min-width:60px}.bar i{display:block;height:100%;background:#2a9d8f;border-radius:8px}
canvas{width:100%;max-width:820px;border:1px solid #ccd;background:#fff;margin-bottom:8px;display:block}.opt{font-size:30px;margin:6px;min-width:110px;background:var(--b)}.sel{outline:4px solid var(--p)}#avp button{font-size:28px}.warn{color:#b00020}.err{color:#b00020}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// ===== DỮ LIỆU CHUẨN: 29 chữ cái và 14 nét =====
const LET='a ă â b c d đ e ê g h i k l m n o ô ơ p q r s t u ư v x y'.split(' ');
const STR=['Nét thẳng đứng','Nét ngang','Nét xiên phải','Nét xiên trái','Nét cong kín','Nét cong hở phải','Nét cong hở trái','Nét móc xuôi (móc trái)','Nét móc ngược (móc phải)','Nét móc hai đầu','Nét thắt trên','Nét móc hai đầu có thắt ở giữa','Nét khuyết trên (xuôi)','Nét khuyết dưới (ngược)'];
// Hình minh họa nét (vẽ ban đầu, giáo viên cần đối chiếu với tài liệu của trường)
const SP=['M20 4V36','M4 20H36','M8 36L32 4','M8 4L32 36','M20 5C8 5 8 35 20 35C32 35 32 5 20 5Z','M12 5C32 12 32 28 12 35','M28 5C8 12 8 28 28 35','M26 5V28C26 36 14 36 10 30','M12 5V28C12 36 24 36 30 30','M10 6V24C10 36 30 36 30 24V6','M8 34C16 22 26 10 26 6C26 2 14 2 14 6C14 10 24 22 32 34','M9 6V16C9 26 20 22 20 20C20 17 16 17 16 20C16 24 30 26 31 16V6','M12 36C26 24 34 8 26 5C18 2 14 12 18 24V36','M12 4C26 16 34 32 26 35C18 38 14 28 18 16V4'];
const svg=(i,s=90)=>`<svg viewBox="0 0 40 40" width="${s}" height="${s}"><path d="${SP[i]}" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const AV=['🐼','🐰','🐻','🐱','🐶','🦁','🐯','🐸','🐨','🦊'];
let S={me:null,items:{},prog:{},font:null,preview:false,mute:false,avSel:'🐼'},XR=.5;
let DB;const DB0=()=>({users:[],sess:null,items:{},prog:[],ws:[],set:{},id:1});try{DB=JSON.parse(localStorage.getItem('bevui_db'))||DB0()}catch{DB=DB0()}
const save=()=>{try{localStorage.setItem('bevui_db',JSON.stringify(DB))}catch{toast('Không lưu được dữ liệu trên trình duyệt này (bộ nhớ đầy hoặc chế độ riêng tư).')}};
const HH=async(p,s)=>{const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);return btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(s),iterations:150000},k,256))))};
const pubU=u=>({id:u.id,username:u.username,name:u.name,display:u.display,role:u.role,avatar:u.avatar,cls:u.cls,created:u.created}),Er=m=>{throw new Error(m)},nowI=()=>new Date().toISOString();
const avOk=a=>AV.includes(a)||(typeof a=='string'&&/^data:image\/(png|jpe?g|webp);base64,/.test(a)&&a.length<3e5);
const DEFR={lessonStars:1,badges:[[1,'🌱','Bé chăm học'],[10,'🌿','Bé chăm luyện chữ'],[25,'🌟','Bé thông minh'],[45,'🏆','Siêu sao học viết']]},GIDS=['g1','g2','g3','g4','g5','g6','g7','g8','g9'];
const cfgL=()=>{const c=DB.set.config||{};return{games:Object.fromEntries(GIDS.map(g=>[g,{on:1,stars:1,count:5,...(c.games||{})[g]}])),rewards:{...DEFR,...c.rewards}}};
const api=async(m,p,b={})=>{const [path,q]=p.split('?'),k=m+' '+path,u=DB.users.find(x=>x.id==DB.sess),need=r=>{if(!u)Er('Vui lòng đăng nhập.');if(r&&u.role!=r)Er('Bạn không có quyền thực hiện thao tác này.')};
 if(k=='POST register'){const un=String(b.username||'').trim().toLowerCase(),pw=String(b.password||''),role=b.role=='teacher'?'teacher':'student',name=String(b.name||'').trim().slice(0,60),dp=String(b.display||name).trim().slice(0,40);
  if(!/^[a-z0-9_.@-]{3,40}$/.test(un))Er('Mã tài khoản gồm 3-40 ký tự (chữ không dấu, số, . _ - @).');if(pw.length<6)Er('Mật khẩu tối thiểu 6 ký tự.');if(!name||!dp)Er('Vui lòng nhập họ tên.');
  const hasT=DB.users.some(x=>x.role=='teacher');if(role=='teacher'&&hasT&&b.code!==DB.set.tcode)Er('Mã xác nhận giáo viên không đúng.');if(DB.users.some(x=>x.username==un))Er('Mã tài khoản đã tồn tại.');
  if(role=='teacher'&&!hasT)DB.set.tcode=crypto.randomUUID().slice(0,8);const salt=crypto.randomUUID();
  DB.users.push({id:DB.id++,username:un,name,display:dp,role,salt,pw:await HH(pw,salt),avatar:avOk(b.avatar)?b.avatar:'🐼',cls:String(b.cls||'').trim().slice(0,20),created:nowI()});save();return{ok:1}}
 if(k=='POST login'){const x=DB.users.find(v=>v.username==String(b.username||'').trim().toLowerCase());if(!x||await HH(String(b.password||''),x.salt)!==x.pw)Er('Tên đăng nhập hoặc mật khẩu không chính xác.');DB.sess=x.id;save();return{user:pubU(x)}}
 if(k=='POST logout'){DB.sess=null;save();return{ok:1}}
 if(k=='GET me'){if(!u)Er('Chưa đăng nhập.');return{user:pubU(u)}}
 need();
 if(k=='POST profile'){const dp=String(b.display||'').trim().slice(0,40);if(!dp)Er('Tên hiển thị không được để trống.');if(!avOk(b.avatar))Er('Ảnh đại diện không hợp lệ.');u.display=dp;u.avatar=b.avatar;save();return{user:pubU(u)}}
 if(k=='GET items')return{items:Object.entries(DB.items).map(([key,v])=>({key,...v}))};
 if(k=='PUT items'){need('teacher');if(!/^[ls]:\S{1,2}$/.test(b.key||''))Er('Mã nội dung không hợp lệ.');const url=String(b.url||'').trim();if(url&&!/^https?:\/\/(www\.|m\.)?(youtube\.com|youtu\.be|youtube-nocookie\.com)\//.test(url))Er('Link không phải YouTube hợp lệ.');
  const stk=String(b.strokes||'').split(',').map(Number).filter(n=>n>=1&&n<=14).slice(0,8).join(',');if(!url&&!b.note&&!b.title&&!stk)delete DB.items[b.key];else DB.items[b.key]={title:String(b.title||'').slice(0,200),url,note:String(b.note||'').slice(0,3000),strokes:stk};save();return{ok:1}}
 if(k=='GET progress')return{rows:DB.prog.filter(r=>r.uid==u.id).map(({key,stars,score,ts})=>({key,stars,score,ts}))};
 if(k=='POST progress'){need('student');if(!/^((view|done):[ls]:\S{1,2}|game:g[1-9])$/.test(b.key||''))Er('Dữ liệu không hợp lệ.');const C=cfgL();if(b.key.startsWith('game:')&&!C.games[b.key.slice(5)].on)Er('Trò chơi này đang tắt.');
  const st=b.key.startsWith('view')?0:b.key.startsWith('game')?C.games[b.key.slice(5)].stars:C.rewards.lessonStars,ex=DB.prog.find(r=>r.uid==u.id&&r.key==b.key);if(ex){ex.score=Math.max(ex.score||0,+b.score||0);ex.ts=nowI();save();return{stars:0}}DB.prog.push({uid:u.id,key:b.key,stars:st,score:+b.score||0,ts:nowI()});save();return{stars:st}}
 if(k=='GET students'){need('teacher');return{students:DB.users.filter(x=>x.role=='student').sort((x,y)=>(x.cls+x.display).localeCompare(y.cls+y.display)).map(s=>{const r=DB.prog.filter(x=>x.uid==s.id),c=p=>r.filter(x=>x.key.startsWith(p)).length;return{...pubU(s),letters:c('done:l:'),strokes:c('done:s:'),games:c('game:'),stars:r.reduce((a,x)=>a+x.stars,0),last:r.map(x=>x.ts).sort().pop()||null}})}}
 if(k=='POST student-reset'){need('teacher');if(String(b.password||'').length<6)Er('Mật khẩu tối thiểu 6 ký tự.');const s=DB.users.find(x=>x.id==b.id&&x.role=='student');if(s){s.salt=crypto.randomUUID();s.pw=await HH(b.password,s.salt)}save();return{ok:1}}
 if(k=='GET worksheets'){need('teacher');return{rows:DB.ws.filter(w=>w.owner==u.id).sort((x,y)=>y.id-x.id)}}
 if(k=='POST worksheets'){need('teacher');const nm=String(b.name||'Phiếu mới').slice(0,100),js=JSON.stringify(b.json||{}),w=DB.ws.find(x=>x.id==b.id&&x.owner==u.id);if(w){w.name=nm;w.json=js;save();return{id:w.id}}const id=DB.id++;DB.ws.push({id,owner:u.id,name:nm,json:js,created:nowI()});save();return{id}}
 if(k=='DELETE worksheets'){need('teacher');const id=new URLSearchParams(q).get('id');DB.ws=DB.ws.filter(w=>!(w.id==id&&w.owner==u.id));save();return{ok:1}}
 if(k=='GET font')return DB.set.font?{...DB.set.font}:{};
 if(k=='PUT font'){need('teacher');if(!/^[A-Za-z0-9+/=]+$/.test(b.data||''))Er('File font không hợp lệ.');DB.set.font={name:String(b.name||'font.ttf').slice(0,100),data:b.data};save();return{ok:1}}
 if(k=='DELETE font'){need('teacher');delete DB.set.font;save();return{ok:1}}
 if(k=='GET teachercode'){need('teacher');return{code:DB.set.tcode}}
 if(k=='GET config')return cfgL();
 if(k=='PUT config'){need('teacher');const r=b.rewards||{},g={};for(const i of GIDS){const x=(b.games||{})[i]||{};g[i]={on:x.on?1:0,stars:Math.min(5,Math.max(0,Math.round(+x.stars)||0)),count:Math.min(10,Math.max(3,Math.round(+x.count)||5))}}
  const bd=(r.badges||[]).slice(0,8).map(x=>[Math.max(1,Math.round(+x[0])||1),String(x[1]||'⭐').slice(0,8),String(x[2]||'').slice(0,40)]).filter(x=>x[2]).sort((x,y)=>x[0]-y[0]);DB.set.config={games:g,rewards:{lessonStars:Math.min(5,Math.max(0,Math.round(+r.lessonStars)||0)),badges:bd.length?bd:DEFR.badges}};save();return{ok:1}}
 if(k=='POST bonus'){need('teacher');const st=Math.round(+b.stars);if(!(st>=1&&st<=10)||!DB.users.some(x=>x.id==b.uid&&x.role=='student'))Er('Dữ liệu không hợp lệ (tặng 1-10 sao cho một học sinh).');DB.prog.push({uid:+b.uid,key:'bonus:'+Date.now()+':'+String(b.reason||'Thưởng của giáo viên').replace(/[\r\n]/g,' ').slice(0,40),stars:st,score:0,ts:nowI()});save();return{ok:1}}
 if(k=='GET ai')return{enabled:false,on:false,hasKey:false,model:''};
 if(k.includes(' ai'))Er('Trợ lý AI cần một máy chủ riêng để giữ API Key an toàn, nên bản chạy trong trình duyệt chưa hỗ trợ.');
 Er('Không tìm thấy.')};
const bk=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));a.download='bevui_sao_luu_'+nowI().slice(0,10)+'.json';a.click()};
const rs=async i=>{try{const d=JSON.parse(await i.files[0].text());if(!Array.isArray(d.users))throw 0;DB=d;save();location.reload()}catch{toast('File sao lưu không hợp lệ')}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2800)};
const av=u=>u.avatar?.startsWith('data:')?`<img class="av" src="${u.avatar}">`:`<span class="av">${esc(u.avatar||'🙂')}</span>`;
const say=t=>{if(!S.mute&&window.speechSynthesis&&t){const u=new SpeechSynthesisUtterance(t);u.lang='vi-VN';u.rate=.7;speechSynthesis.cancel();speechSynthesis.speak(u)}};
const ytId=u=>(String(u||'').match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/)||[])[1];
const nav=h=>{const o=location.hash;location.hash='#/'+h;if(location.hash==o)go()};
const keyName=k=>{if(k.startsWith('bonus:'))return '🎁 '+k.split(':').slice(2).join(':');const [t,a,b]=k.split(':');return t=='game'?GAMES[a]?.n:(a=='l'?'Chữ '+b:STR[b-1])};
// ===== KHỞI ĐỘNG =====
async function init(){try{S.me=(await api('GET','me')).user}catch{}if(S.me)await loadAll();go()}
async function loadAll(){const [i,f,cg,ai]=await Promise.all([api('GET','items'),api('GET','font'),api('GET','config'),api('GET','ai')]);S.cfg=cg;S.ai=ai;S.items=Object.fromEntries(i.items.map(x=>[x.key,x]));
 if(S.me.role=='student'){S.prog=Object.fromEntries((await api('GET','progress')).rows.map(x=>[x.key,x]))}
 S.font=f.data?f:null;if(S.font)try{await useFont()}catch{S.font=null;toast('File font lỗi, hãy tải lại font khác.')}}
async function useFont(){const b=Uint8Array.from(atob(S.font.data),c=>c.charCodeAt(0));const ff=new FontFace('WF',b.buffer);await ff.load();document.fonts.add(ff);const x=document.createElement('canvas').getContext('2d');x.font='200px WF';XR=x.measureText('x').actualBoundingBoxAscent/200||.5}
const canSave=()=>S.me.role=='student';
window.onhashchange=()=>go();
function go(){if(!S.me)return auth('w');const tch=S.me.role=='teacher'&&!S.preview;const [p,a]=decodeURIComponent(location.hash.slice(2)).split('/');tch?tPage(p||'students'):sPage(p||'home',a)}
// ===== ĐĂNG KÝ / ĐĂNG NHẬP =====
function avPick(){return `<div id="avp">${AV.map(a=>`<button type="button" class="${a==S.avSel?'sel':''}" onclick="S.avSel='${a}';refAv()">${a}</button>`).join('')}<label>Hoặc tải ảnh từ máy<input type="file" accept="image/*" onchange="upAv(this)"></label>Xem trước: ${av({avatar:S.avSel})}</div>`}
const refAv=()=>$('#avp').outerHTML=avPick();
async function upAv(i){const f=i.files[0];if(!f)return;const im=new Image();im.src=URL.createObjectURL(f);await im.decode();const c=document.createElement('canvas');c.width=c.height=128;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);S.avSel=c.toDataURL('image/jpeg',.8);refAv()}
function auth(m,msg=''){document.body.className='';S.avSel='🐼';
 if(m=='w')return app.innerHTML=`<main style="text-align:center"><h1>🐼 CHÀO MỪNG BẠN ĐẾN VỚI BÉ VUI HỌC VIẾT!</h1><p>${esc(msg)}</p><p><small>Bản chạy trên trình duyệt: dữ liệu lưu ngay trên máy/trình duyệt này.</small></p><button class="big" onclick="auth('r')">ĐĂNG KÝ TÀI KHOẢN</button><button class="big" style="background:var(--b)" onclick="auth('l')">ĐĂNG NHẬP</button></main>`;
 if(m=='l')return app.innerHTML=`<main><div class="card" style="max-width:440px;margin:auto"><h2>Đăng nhập</h2><p>${esc(msg)}</p><form onsubmit="return doLogin(event)"><label>Tên đăng nhập / email / mã tài khoản<input id="lu" required></label><label>Mật khẩu<input id="lp" type="password" required></label><label><input type="checkbox" style="width:auto" onchange="$('#lp').type=this.checked?'text':'password'"> Hiện mật khẩu</label><p class="err" id="err"></p><button class="big">ĐĂNG NHẬP</button> <button type="button" onclick="auth('r')">Đăng ký tài khoản</button></form><p><small>Quên mật khẩu: học sinh nhờ giáo viên đặt lại; giáo viên liên hệ quản trị máy chủ.</small></p></div></main>`;
 app.innerHTML=`<main><div class="card" style="max-width:560px;margin:auto"><h2>Đăng ký tài khoản</h2><form onsubmit="return doReg(event)"><label>Bạn là<select id="rr" onchange="$('.st').hidden=this.value!='student';$('.te').hidden=this.value!='teacher'"><option value="student">Học sinh</option><option value="teacher">Giáo viên / Phụ huynh</option></select></label>
 <label>Họ và tên<input id="rn" required></label><label>Tên hiển thị<input id="rd"></label><label>Mã tài khoản / email đăng nhập<input id="ru" required></label><label>Mật khẩu (≥ 6 ký tự)<input id="rp" type="password" required></label><label>Nhập lại mật khẩu<input id="rp2" type="password" required></label>
 <div class="st"><label>Lớp / mã lớp (ví dụ 1A)<input id="rc"></label></div><div class="te" hidden><label>Mã xác nhận giáo viên (bỏ trống nếu bạn là giáo viên đầu tiên)<input id="rk"></label></div>
 <p>Chọn avatar:</p>${avPick()}<p class="err" id="err"></p><button class="big">TẠO TÀI KHOẢN</button> <button type="button" onclick="auth('w')">Quay lại</button></form></div></main>`}
async function doReg(e){e.preventDefault();const g=i=>$('#'+i)?.value||'';if(g('rp')!=g('rp2')){$('#err').textContent='Mật khẩu nhập lại không khớp.';return false}
 try{await api('POST','register',{role:g('rr'),username:g('ru'),name:g('rn'),display:g('rd')||g('rn'),password:g('rp'),cls:g('rc'),code:g('rk'),avatar:S.avSel});auth('l','Chúc mừng! Bạn đã tạo tài khoản thành công. Hãy đăng nhập nhé.')}catch(x){$('#err').textContent=x.message}return false}
async function doLogin(e){e.preventDefault();try{S.me=(await api('POST','login',{username:$('#lu').value,password:$('#lp').value})).user;S.preview=false;await loadAll();location.hash='#/';go()}catch(x){$('#err').textContent=x.message}return false}
async function logout(){await api('POST','logout');S.me=null;CH=[];S.prog={};S.preview=false;auth('w')}
function shell(n,html){document.body.className=S.me.role=='teacher'&&!S.preview?'tch':'';app.innerHTML=`<header><b>✏️ BÉ VUI HỌC VIẾT</b><nav>${n.map(([h,t])=>`<button onclick="nav('${h}')">${t}</button>`).join('')}</nav>${S.me.role=='teacher'?`<button onclick="S.preview=!S.preview;nav('');go()">${S.preview?'↩ Thoát xem trước':'👁 Xem như học sinh'}</button>`:`<button onclick="S.mute=!S.mute;toast(S.mute?'Đã tắt tiếng':'Đã bật tiếng')">🔊/🔇</button>`}<span>${av(S.me)} ${esc(S.me.display)}</span><button onclick="logout()">Thoát</button></header><main>${html}</main>`}
// ===== HỒ SƠ (dùng chung) =====

 <div class="row2"><div class="card" onclick="nav('letters')"><h3>🔤 29 chữ cái</h3>${LET.filter(l=>done('l:'+l)).length}/29 đã hoàn thành</div><div class="card" onclick="nav('strokes')"><h3>✏️ 14 nét cơ bản</h3>${STR.filter((s,i)=>done('s:'+(i+1))).length}/14 đã hoàn thành</div><div class="card" onclick="nav('games')"><h3>🎮 Trò chơi của bé</h3>${Object.keys(S.prog).filter(k=>k.startsWith('game:')).length}/${Object.keys(GAMES).length} đã chơi</div><div class="card" onclick="nav('stars')"><h3>⭐ Số sao của em</h3><b style="font-size:32px">${totalStars()}</b></div></div>`)}

 if(canSave()&&!S.prog['view:'+key]){S.prog['view:'+key]={};api('POST','progress',{key:'view:'+key}).catch(()=>{})}

 <div class="card" style="text-align:center">${done(key)?'<h3>✅ Con đã hoàn thành bài này!</h3>':`<button class="big" onclick="fin('${key}')">✅ CON ĐÃ HỌC XONG</button>`}<p>✏️ Bây giờ con hãy luyện viết trên giấy nhé!</p></div>`)}

const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]),others=(a,n,ex)=>sh(a.filter(x=>x!==ex)).slice(0,n),N14=[...Array(14).keys()];
const qStroke=()=>sh(N14).slice(0,10).map(i=>({p:'Đây là nét gì?',show:svg(i,120),o:sh([i,...others(N14,3,i)]).map(j=>({h:esc(STR[j]),ok:j==i}))}));

const qListen=()=>sh(LET).slice(0,10).map(l=>({p:'Con nghe và chọn chữ đúng nhé',say:l,o:sh([l,...others(LET,5,l)]).map(x=>({h:`<span class="wf">${x}</span>`,ok:x==l}))}));
const pS=l=>(S.items['l:'+l]?.strokes||'').split(',').map(Number).filter(n=>n>=1&&n<=14),SL=(m=1)=>LET.filter(l=>pS(l).length>=m),notIn=s=>N14.map(i=>i+1).filter(n=>!s.includes(n));
const qBuild=()=>sh(SL()).slice(0,10).map(l=>{const s=pS(l);return{type:'build',l,p:`Con hãy ghép các nét để tạo thành chữ ${l}`,need:s,pool:sh([...s,...others(notIn(s),2)])}});

const qIn=()=>sh(SL()).slice(0,10).map(l=>{const s=pS(l),ok=sh(s)[0];return{p:`Chữ ${l} có nét nào?`,say:`Chữ ${l} có nét nào?`,show:`<div class="wf" style="font-size:90px">${l}</div>`,o:sh([ok,...others(notIn(s),3)]).map(n=>({h:svg(n-1,70),ok:n==ok}))}});
const GAMES={g1:{n:'Chọn tên nét',q:qStroke},g2:{n:'Tìm chữ cái',q:qFind},g3:{n:'Nghe và chọn chữ',q:qListen},g4:{n:'Nét nào phù hợp?',q:qPick},g5:{n:'Ôn tập 29 chữ',q:()=>sh([...qFind(),...qListen()]).slice(0,10)},g6:{n:'Ôn tập 14 nét',q:()=>sh([...qStroke(),...qPick()]).slice(0,10)},g7:{n:'Ghép nét tạo chữ',q:qBuild,min:1},g8:{n:'Sắp xếp nét',q:qOrder,min:2},g9:{n:'Tìm nét trong chữ',q:qIn,min:1}};
let G={};
function sGames(){const E=Object.entries(GAMES).filter(([k])=>S.cfg.games[k].on);shell(snav(),`<div class="card"><h2>🎮 Trò chơi của bé</h2><div class="row2">${E.map(([k,g])=>{const no=g.min&&!SL(g.min).length;return `<div class="card tile" style="font-size:22px;${no?'opacity:.5':''}" onclick="${no?"toast('Giáo viên chưa nhập cấu tạo chữ cho trò chơi này')":`nav('play/${k}')`}">${g.n}<small>${S.prog['game:'+k]?'✅ Đã chơi':no?'Chưa sẵn sàng':'Chơi nào!'}</small></div>`}).join('')}</div></div>`)}
function play(k){if(!GAMES[k]||!S.cfg.games[k].on)return sGames();G={k,qs:GAMES[k].q().slice(0,S.cfg.games[k].count),i:0,s:0,t:0,lock:0};G.qs.length?ask():(toast('Chưa có dữ liệu cho trò chơi này'),sGames())}
function ask(){const q=G.qs[G.i];if(q.type)return askT(q);G.t=0;G.lock=0;shell(snav(),`<div class="card" style="text-align:center"><h3>${GAMES[G.k].n} · Câu ${G.i+1}/${G.qs.length}</h3><h1>${esc(q.p)}</h1><button onclick="say(G.qs[G.i].say||G.qs[G.i].p)">🔊 NGHE</button><div>${q.show||''}</div><div style="font-size:40px">${q.o.map((o,i)=>`<button class="opt" onclick="pickA(${i})">${o.h}</button>`).join('')}</div><h2 id="fb">&nbsp;</h2></div>`);say(q.say||q.p)}
function pickA(i){if(G.lock)return;if(G.qs[G.i].o[i].ok){G.lock=1;if(!G.t)G.s++;$('#fb').textContent='🎉 Giỏi quá!';say('Giỏi quá!');setTimeout(()=>{G.i++;G.i<G.qs.length?ask():endG()},1000)}else{G.t++;$('#fb').textContent='Chưa đúng rồi, con nhìn kỹ lại và thử lại nhé! 💪';say('Con thử lại nhé')}}

 shell(snav(),`<div class="card" style="text-align:center"><h1>🏆 Con hoàn thành rồi!</h1><h2>Con trả lời đúng ngay lần đầu ${G.s}/${G.qs.length} câu</h2><h2>${st?'Con nhận được +1 ⭐':canSave()?'Con đã nhận sao của trò chơi này rồi.':'(Xem trước: không lưu)'}</h2><button class="big" onclick="play('${G.k}')">Chơi lại</button><button class="big" onclick="nav('games')">Trò chơi khác</button></div>`);say('Giỏi quá!')}
async function sStars(){try{S.prog=Object.fromEntries((await api('GET','progress')).rows.map(x=>[x.key,x]))}catch{}const t=totalStars(),B=S.cfg.rewards.badges,ks=Object.values(S.prog).filter(r=>r.stars).sort((a,b)=>(b.ts||'')<(a.ts||'')?-1:1);
 shell(snav(),`<div class="card" style="text-align:center"><h1>⭐ NGÔI SAO CỦA EM</h1><div style="font-size:60px">${t} ⭐</div><p>Bài đã hoàn thành: ${Object.keys(S.prog).filter(k=>k.startsWith('done:')).length} · Trò chơi đã chơi: ${Object.keys(S.prog).filter(k=>k.startsWith('game:')).length}</p></div><div class="card"><h3>Huy hiệu</h3>${B.map(([n,e,l])=>`<span style="font-size:20px;margin:8px;opacity:${t>=n?1:.3}">${e} ${l} (${n}⭐)</span>`).join('')}</div><div class="card"><h3>Lịch sử nhận thưởng</h3>${ks.length?ks.map(r=>`<div>+${r.stars}⭐ ${esc(keyName(r.key))} <small>${r.ts?new Date(r.ts).toLocaleString('vi-VN'):''}</small></div>`).join(''):'Chưa có sao nào. Học bài hoặc chơi trò chơi nhé!'}</div>`)}

async function tSheet(){SHEETS=(await api('GET','worksheets')).rows;sheetUI()}
function sheetUI(){const f=(l,k,t='text',x='')=>`<label>${l}<input type="${t}" ${x} value="${esc(W[k])}" oninput="W['${k}']=${t=='number'?'+':''}this.value;pv()"></label>`;
 shell(tnav(),`<div class="card"><h2>TRÌNH TẠO PHIẾU TẬP VIẾT (giấy ô ly)</h2><div class="row2">${f('Tiêu đề','title')}${f('Họ tên học sinh','student')}${f('Lớp','cls')}${f('Ngày','date')}${f('Cạnh ô ly (mm)','cell','number','step="0.5" min="3" max="8"')}${f('Cỡ chữ hiệu chỉnh (%)','scale','number','min="50" max="150"')}${f('Khoảng cách chữ (ô)','gap','number','step="0.5" min="0" max="6"')}${f('Lề (mm)','margin','number','min="5" max="30"')}${f('Màu chữ','color','color')}${f('Độ mờ chữ mờ (0.05-1)','ghost','number','step="0.05" min="0.05" max="1"')}<label>Khổ giấy<select onchange="W.orient=this.value;pv()"><option value="p" ${W.orient=='p'?'selected':''}>A4 dọc</option><option value="l" ${W.orient=='l'?'selected':''}>A4 ngang</option></select></label></div><p><small>Mỗi dòng viết gồm 5 ô phía trên đường chuẩn (đậm) và 2 ô phía dưới cho chữ có đuôi. Chiều cao chữ do font quyết định; hệ thống đo chiều cao chữ x của font để chữ thường cao đúng 2 ô.</small></p></div>
 <div class="card"><h3>Các dòng</h3><div id="rws" style="overflow:auto"></div><button onclick="W.rows.push({t:'',m:'dotted',r:6});rws();pv()">➕ Thêm dòng</button><hr><label>Tạo nhanh: các chữ/từ cách nhau bởi dấu cách (mỗi chữ một dòng)<input id="qk" placeholder="a ă â"></label><div class="row2"><select id="qm">${MODES.map(([v,l])=>`<option value="${v}" ${v=='dotted'?'selected':''}>${l}</option>`).join('')}</select><input id="qr" type="number" value="6" min="1"><button onclick="quick()">Tạo dòng</button></div></div>
 <div class="card"><h3>Xem trước</h3><div id="pvbox"></div><p class="warn" id="pwn"></p><div class="row2"><label>Tên file PDF<input id="fn" value="Phieu_tap_viet"></label><button onclick="pv()">👁 XEM TRƯỚC</button><button onclick="mkpdf()">📥 XUẤT PDF</button></div></div>
 <div class="card"><h3>Lưu / phiếu đã lưu</h3><div class="row2"><input id="sn" value="${esc(SNAME)}"><button onclick="saveSheet()">💾 Lưu phiếu</button><button onclick="W=DEF();SID=null;SNAME='Phiếu mới';sheetUI()">Phiếu mới</button></div><table>${SHEETS.map(s=>`<tr><td>${esc(s.name)}${s.id==SID?' (đang mở)':''}</td><td>${new Date(s.created).toLocaleDateString('vi-VN')}</td><td><button onclick="openSh(${s.id})">Mở/sửa</button><button onclick="openSh(${s.id},1)">Sao chép</button><button onclick="delSh(${s.id})">Xóa</button></td></tr>`).join('')}</table></div>`);rws();pv()}
function rws(){$('#rws').innerHTML=`<table>${W.rows.map((r,i)=>`<tr><td><input value="${esc(r.t)}" placeholder="Nội dung dòng" oninput="W.rows[${i}].t=this.value;pv()"></td><td><select onchange="W.rows[${i}].m=this.value;pv()">${MODES.map(([v,l])=>`<option value="${v}" ${v==r.m?'selected':''}>${l}</option>`).join('')}</select></td><td style="width:80px"><input type="number" min="1" max="40" value="${r.r}" oninput="W.rows[${i}].r=+this.value;pv()"></td><td style="white-space:nowrap"><button onclick="ro(${i},'u')">↑</button><button onclick="ro(${i},'d')">↓</button><button onclick="ro(${i},'c')">⧉</button><button onclick="ro(${i},'x')">✕</button></td></tr>`).join('')}</table>`}
function ro(i,o){const R=W.rows;if(o=='x')R.splice(i,1);else if(o=='c')R.splice(i+1,0,{...R[i]});else if(o=='u'&&i>0)[R[i-1],R[i]]=[R[i],R[i-1]];else if(o=='d'&&i<R.length-1)[R[i+1],R[i]]=[R[i],R[i+1]];rws();pv()}
function quick(){const m=$('#qm').value,r=+$('#qr').value||1;$('#qk').value.trim().split(/\s+/).filter(Boolean).forEach(t=>W.rows.push({t,m,r}));$('#qk').value='';rws();pv()}
function layout(W){const pw=W.orient=='p'?210:297,ph=pw==210?297:210,c=+W.cell,m=+W.margin,cols=Math.floor((pw-2*m)/c),gx=(pw-cols*c)/2,hdr=Math.ceil(18/c),RC=7,B=5,rpp=Math.max(1,Math.floor((ph-2*m-hdr*c)/(RC*c))),gy=m+hdr*c,em=2*c/XR*W.scale/100,warn=[],pages=[],n=Math.max(1,Math.ceil(W.rows.length/rpp));
 for(let p=0;p<n;p++){const o=[],gh=rpp*RC*c;o.push({t:W.title,x:pw/2,y:m+6,em:7,al:'center',m:'h',c:'#111111'},{t:`Họ và tên: ${W.student||'……………………………'}    Lớp: ${W.cls||'………'}    Ngày: ${W.date}`,x:gx,y:m+14,em:4.2,m:'h',c:'#111111'});
  for(let i=0;i<=cols;i++)o.push({l:1,x:gx+i*c,y:gy,x2:gx+i*c,y2:gy+gh,w:.12,c:'#9db4d8'});
  for(let j=0;j<=rpp*RC;j++){const r=j%RC,k=r==B?2:r==B-2?1:0;o.push({l:1,x:gx,y:gy+j*c,x2:gx+cols*c,y2:gy+j*c,w:[.12,.22,.45][k],c:['#9db4d8','#5f87c4','#2b59a8'][k]})}
  W.rows.slice(p*rpp,(p+1)*rpp).forEach((r,k)=>{if(r.m=='blank'||!r.t)return;const y=gy+(k*RC+B)*c,tw=mw(r.t,em);let x=gx;for(let i=0;i<Math.max(1,r.r);i++){if(x+tw>gx+cols*c+.01){warn.push(`Dòng ${p*rpp+k+1}: chỉ vừa ${i}/${r.r} lần lặp.`);break}o.push({t:r.t,x,y,em,m:r.m,c:W.color});x+=tw+W.gap*c}});pages.push(o)}
 return{pw,ph,pages,warn}}
function paint(x,pg,k){x.fillStyle='#fff';x.fillRect(0,0,9999,9999);for(const o of pg){x.setLineDash([]);x.globalAlpha=1;if(o.l){x.strokeStyle=o.c;x.lineWidth=o.w*k;x.beginPath();x.moveTo(o.x*k,o.y*k);x.lineTo(o.x2*k,o.y2*k);x.stroke();continue}
 x.font=`${o.em*k}px WF`;x.textAlign=o.al||'left';x.fillStyle=x.strokeStyle=o.c;x.lineWidth=.25*k;
 if(o.m=='dotted'){x.globalAlpha=.9;x.setLineDash([.4*k,.7*k]);x.strokeText(o.t,o.x*k,o.y*k)}else{if(o.m=='ghost')x.globalAlpha=W.ghost;x.fillText(o.t,o.x*k,o.y*k);if(o.m=='bold')x.strokeText(o.t,o.x*k,o.y*k)}}}
function pv(){clearTimeout(pv.h);pv.h=setTimeout(()=>{const b=$('#pvbox');if(!b)return;if(!S.font){b.innerHTML='<p class="warn">⚠ Chưa cấu hình font tập viết. Vào "Cài đặt & font" để tải file .ttf. Hệ thống không dùng font dự phòng.</p>';return}
 const L=layout(W);b.innerHTML='';L.pages.forEach(pg=>{const c=document.createElement('canvas');c.width=L.pw*4;c.height=L.ph*4;paint(c.getContext('2d'),pg,4);b.append(c)});$('#pwn').textContent=L.warn.length?'⚠ '+L.warn.join(' '):''},60)}
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
function pdfop(d,o){const c=rgb(o.c);if(o.l){d.setGState(new d.GState({opacity:1,'stroke-opacity':1}));d.setDrawColor(...c);d.setLineWidth(o.w);d.line(o.x,o.y,o.x2,o.y2);return}
 d.setFontSize(o.em*72/25.4);d.setTextColor(...c);d.setDrawColor(...c);d.setLineWidth(.25);const a=o.m=='ghost'?W.ghost:o.m=='dotted'?.9:1;d.setGState(new d.GState({opacity:a,'stroke-opacity':a}));
 if(o.m=='dotted'){d.setLineDashPattern([.4,.7],0);d.text(o.t,o.x,o.y,{renderingMode:'stroke'});d.setLineDashPattern([],0)}else d.text(o.t,o.x,o.y,{align:o.al||'left',renderingMode:o.m=='bold'?'fillThenStroke':'fill'})}
function mkpdf(){if(!S.font)return toast('Chưa cấu hình font tập viết.');if(!window.jspdf)return toast('Chưa tải được thư viện PDF (cần Internet hoặc xem README).');
 const L=layout(W),d=new jspdf.jsPDF({unit:'mm',format:'a4',orientation:W.orient=='p'?'portrait':'landscape'});d.addFileToVFS('wf.ttf',S.font.data);d.addFont('wf.ttf','WF','normal');d.setFont('WF','normal');
 L.pages.forEach((pg,i)=>{if(i)d.addPage();pg.forEach(o=>pdfop(d,o))});d.save(($('#fn').value||'Phieu_tap_viet').replace(/[^\w-]/g,'_')+'.pdf');toast('Đã tạo file PDF thành công!')}
async function saveSheet(){SNAME=$('#sn').value||'Phiếu mới';try{SID=(await api('POST','worksheets',{id:SID,name:SNAME,json:W})).id;toast('Đã lưu phiếu');tSheet()}catch(x){toast(x.message)}}
function openSh(id,cp){const s=SHEETS.find(x=>x.id==id);W={...DEF(),...JSON.parse(s.json)};SID=cp?null:id;SNAME=cp?s.name+' (bản sao)':s.name;sheetUI();scrollTo(0,0)}
async function delSh(id){if(!confirm('Xóa phiếu này?'))return;await api('DELETE','worksheets?id='+id);if(SID==id)SID=null;tSheet()}
// ===== TRÒ CHƠI NÉT (dùng dữ liệu cấu tạo chữ do giáo viên nhập) =====
const strokeFld=(sel,it)=>sel[0]!='l'?'':`<label>Thứ tự các nét cấu tạo chữ (số 1-14, cách nhau dấu phẩy; dùng cho 3 trò chơi về nét)<input id="cs" value="${esc(it.strokes)}" placeholder="vd: 5,1"></label><div>${STR.map((s,i)=>`<button type="button" title="${esc(s)}" onclick="$('#cs').value+=($('#cs').value?',':'')+${i+1}">${svg(i,28)}${i+1}</button>`).join('')}<button type="button" onclick="$('#cs').value=''">Xóa</button></div>`;
function askT(q){G.t=0;G.lock=0;G.pl=[];shell(snav(),`<div class="card" style="text-align:center"><h3>${GAMES[G.k].n} · Câu ${G.i+1}/${G.qs.length}</h3><h1>${esc(q.p)}</h1><div class="wf" style="font-size:80px">${esc(q.l)}</div><button onclick="say(G.qs[G.i].p)">🔊 NGHE</button><div id="tb"></div><h2 id="fb">&nbsp;</h2></div>`);drawT();say(q.p)}
function drawT(){const q=G.qs[G.i],bd=q.type=='build',sv=n=>svg(n-1,60),n=bd?q.need.length:q.seq.length,
 pool=q.pool.map((v,i)=>G.pl.includes(i)?'':`<button class="opt" style="min-width:0" draggable="true" ondragstart="event.dataTransfer.setData('t','${i}')" onclick="tapT(${i})">${sv(v)}</button>`).join(''),
 slots=Array.from({length:n},(_,s)=>G.pl[s]!==undefined?`<button class="opt" style="min-width:0;background:var(--g)" onclick="unT(${s})">${sv(q.pool[G.pl[s]])}</button>`:`<span style="display:inline-block;width:70px;height:70px;border:3px dashed #aab;border-radius:12px;margin:6px;line-height:70px;color:#aab">${bd?'':s+1}</span>`).join('');
 $('#tb').innerHTML=`<p>${bd?'Kéo (hoặc chạm) các nét vào khung để ghép chữ. Có thể có nét thừa nhé!':'Chạm lần lượt các nét theo thứ tự viết chữ.'}</p><div ondragover="event.preventDefault()" ondrop="tapT(+event.dataTransfer.getData('t'))" style="min-height:90px;border:3px solid var(--b);border-radius:16px;padding:6px">${slots}</div><div style="margin-top:10px">${pool}</div>${bd?'<button class="big" onclick="chkT()">✅ KIỂM TRA</button>':''}`}
function tapT(i){const q=G.qs[G.i];if(G.lock||!(i>=0)||G.pl.includes(i))return;
 if(q.type=='build'){if(G.pl.length<q.need.length)G.pl.push(i)}
 else if(q.pool[i]==q.seq[G.pl.length]){G.pl.push(i);$('#fb').innerHTML='&nbsp;'}
 else{G.t++;$('#fb').textContent='Chưa đúng rồi, con nhớ lại nét viết đầu tiên rồi đến nét tiếp theo nhé! 💪';say('Con thử lại nhé');return}
 drawT();if(q.type=='order'&&G.pl.length==q.seq.length)okQ()}
function unT(s){if(!G.lock&&G.qs[G.i].type=='build'){G.pl.splice(s,1);drawT()}}
function chkT(){const q=G.qs[G.i],a=G.pl.map(i=>q.pool[i]).sort().join(),b=[...q.need].sort().join();if(a==b)okQ();else{G.t++;$('#fb').textContent=G.pl.length<q.need.length?'Con ghép thêm các nét nữa nhé! 💪':'Chưa đúng rồi, con thử đổi các nét nhé! 💪';say('Con thử lại nhé')}}
function okQ(){G.lock=1;if(!G.t)G.s++;$('#fb').textContent='🎉 Giỏi quá!';say('Giỏi quá!');setTimeout(()=>{G.i++;G.i<G.qs.length?ask():endG()},1000)}
// ===== GIÁO VIÊN: TRÒ CHƠI & PHẦN THƯỞNG =====
const bdRow=b=>`<div class="row2 bdr"><input type="number" min="1" value="${b[0]}"><input value="${esc(b[1])}"><input value="${esc(b[2])}" placeholder="Tên huy hiệu"></div>`;
async function tRewards(){S.cfg=await api('GET','config');const C=S.cfg,st=(await api('GET','students')).students;
 shell(tnav(),`<div class="card"><h2>Quản lý trò chơi</h2><div style="overflow:auto"><table><tr><th>Trò chơi</th><th>Bật</th><th>Sao khi hoàn thành (lần đầu)</th><th>Số câu (3-10)</th></tr>${Object.entries(GAMES).map(([k,g])=>{const c=C.games[k];return `<tr><td>${g.n}${g.min&&!SL(g.min).length?' <small class="warn">(chưa có dữ liệu cấu tạo chữ ở mục "Chữ, nét, video")</small>':''}</td><td><input type="checkbox" style="width:auto" id="go${k}" ${c.on?'checked':''}></td><td><input type="number" id="gs${k}" min="0" max="5" value="${c.stars}"></td><td><input type="number" id="gc${k}" min="3" max="10" value="${c.count}"></td></tr>`}).join('')}</table></div></div>
 <div class="card"><h2>Phần thưởng</h2><label>Sao khi hoàn thành một bài học (chữ/nét)<input type="number" id="ls" min="0" max="5" value="${C.rewards.lessonStars}"></label><h3>Huy hiệu (số sao cần có · biểu tượng · tên)</h3><div id="bd">${C.rewards.badges.map(bdRow).join('')}</div><button onclick="$('#bd').insertAdjacentHTML('beforeend',bdRow([50,'🎖','']))">➕ Thêm huy hiệu</button><p><button onclick="saveCfg()">💾 Lưu cấu hình</button></p></div>
 <div class="card"><h2>Tặng sao thủ công</h2><div class="row2"><select id="bu">${st.map(s=>`<option value="${s.id}">${esc(s.display)} (${esc(s.cls)})</option>`).join('')}</select><input id="bn" type="number" min="1" max="10" value="1"><input id="br" placeholder="Lý do (vd: Viết đẹp)"><button onclick="bonus()">🎁 Tặng sao</button></div></div>`)}
async function saveCfg(){const games={};Object.keys(GAMES).forEach(k=>games[k]={on:$('#go'+k).checked,stars:$('#gs'+k).value,count:$('#gc'+k).value});const badges=[...document.querySelectorAll('.bdr')].map(r=>[...r.querySelectorAll('input')].map(i=>i.value));try{await api('PUT','config',{games,rewards:{lessonStars:$('#ls').value,badges}});S.cfg=await api('GET','config');toast('Đã lưu cấu hình');tRewards()}catch(x){toast(x.message)}}
async function bonus(){try{await api('POST','bonus',{uid:$('#bu').value,stars:$('#bn').value,reason:$('#br').value});toast('Đã tặng sao');$('#br').value=''}catch(x){toast(x.message)}}
// ===== TRỢ LÝ AI GEMINI =====
let CH=[];
const aiCfg=()=>`<div class="card"><h3>Cấu hình Gemini</h3><p>API Key do bạn tự cung cấp (tạo tại Google AI Studio). Key chỉ lưu trên máy chủ, không gửi xuống trình duyệt.${S.ai.hasKey?' <b>Đã có key.</b>':''}</p><label>API Key<input id="ak" type="password" autocomplete="off" placeholder="${S.ai.hasKey?'•••• (để trống nếu giữ nguyên)':'Dán API Key'}"></label><label>Model (đổi nếu Google đổi tên model)<input id="am" value="${esc(S.ai.model)}"></label><label><input type="checkbox" style="width:auto" id="ao" ${S.ai.on?'checked':''}> Bật trợ lý AI cho mọi người dùng</label><button onclick="aiSave().then(()=>{toast('Đã lưu');aiPage()}).catch(x=>toast(x.message))">💾 Lưu</button><button onclick="aiTest()">🔌 Lưu & kiểm tra kết nối</button>${S.ai.hasKey?'<button onclick="aiSave(1).then(aiPage)">🗑 Xóa key</button>':''}</div>`;
function aiPage(){const T=S.me.role=='teacher'&&!S.preview;shell(T?tnav():snav(),`<div class="card"><h2>🤖 TRỢ LÝ AI BÉ VUI HỌC VIẾT</h2>${S.ai.enabled?`<div id="cb" style="max-height:50vh;overflow:auto"></div><div class="row2"><input id="cm" placeholder="${T?'Hỏi trợ lý (tạo bài tập, gợi ý trò chơi, nội dung phiếu...)':'Con muốn hỏi gì nào?'}" onkeydown="if(event.key=='Enter')aiSend()"><button onclick="aiSend()">Gửi</button></div>`:`<p>Trợ lý AI chưa được bật${T?'. Hãy cấu hình ở bên dưới.':'. Các phần khác vẫn học bình thường nhé!'}</p>`}</div>${T?aiCfg():''}`);drawCh()}
function drawCh(){const b=$('#cb');if(!b)return;b.innerHTML=CH.map(m=>`<p style="text-align:${m.r=='user'?'right':'left'}"><b>${m.r=='user'?'Bạn':'🤖'}:</b> ${esc(m.t).replace(/\n/g,'<br>')}</p>`).join('')||'<p>Xin chào! Mình có thể giúp gì nào? 😊</p>';b.scrollTop=1e9}
async function aiSend(){const i=$('#cm'),m=i.value.trim();if(!m)return;i.value='';const h=CH.slice(-6).filter(x=>x.t!='…'&&!x.t.startsWith('Lỗi'));CH.push({r:'user',t:m},{r:'model',t:'…'});drawCh();try{CH[CH.length-1].t=(await api('POST','ai/chat',{message:m,history:h})).text}catch(x){CH[CH.length-1].t='Lỗi: '+x.message}drawCh()}
async function aiSave(c){await api('PUT','ai',{key:$('#ak').value,model:$('#am').value,on:$('#ao').checked,clear:c});S.ai=await api('GET','ai')}
async function aiTest(){try{await aiSave();toast('Đang kiểm tra...');await api('POST','ai/test');toast('✅ Kết nối Gemini thành công')}catch(x){toast('❌ '+x.message)}aiPage()}
init();
</script></body></html>
