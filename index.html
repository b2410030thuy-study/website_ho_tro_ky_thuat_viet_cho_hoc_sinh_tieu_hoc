:root{--p:#ff8fab;--b:#8ecae6;--y:#ffd166;--g:#95d5b2;--t:#33415c}*{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:18px/1.4 system-ui,sans-serif;background:#fff9f0;color:var(--t)}body.tch{background:#f4f6fa;font-size:15px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--b)}.tch header{background:#243b53;color:#fff}
nav{display:flex;flex-wrap:wrap;gap:6px;flex:1}button{font:inherit;border:0;border-radius:14px;padding:9px 14px;background:var(--y);cursor:pointer;color:#333;margin:2px}
nav button{background:#ffffffaa}.tch nav button{background:#ffffff26;color:#fff}.big{font-size:24px;padding:14px 26px}
main{max-width:1100px;margin:auto;padding:16px}.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 3px 10px #0001;margin-bottom:14px}.tch .card{border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}.tile{font-size:42px;text-align:center;padding:12px 4px;border-radius:18px;background:#fff;border:3px solid var(--b);cursor:pointer}
.tile small{display:block;font-size:13px}.tile.done{border-color:var(--g);background:#e9f9ef}.wf{font-family:WF}
input,select,textarea{font:inherit;padding:8px;border:2px solid #ccd;border-radius:10px;width:100%}label{display:block;font-size:.85em}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #e3e6ee;text-align:left}.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.video{aspect-ratio:16/9;width:100%;border:0;border-radius:14px}#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#333;color:#fff;padding:12px 20px;border-radius:14px;display:none;z-index:9}
.av{font-size:1.4em}img.av{width:1.6em;height:1.6em;border-radius:50%;object-fit:cover;vertical-align:middle}.bar{background:#e3e6ee;border-radius:8px;height:10px;min-width:60px}.bar i{display:block;height:100%;background:#2a9d8f;border-radius:8px}
canvas{width:100%;max-width:820px;border:1px solid #ccd;background:#fff;margin-bottom:8px;display:block}.opt{font-size:30px;margin:6px;min-width:110px;background:var(--b)}.sel{outline:4px solid var(--p)}#avp button{font-size:28px}.warn{color:#b00020}.err{color:#b00020}

 L.pages.forEach((pg,i)=>{if(i)d.addPage();pg.forEach(o=>pdfop(d,o))});d.save(($('#fn').value||'Phieu_tap_viet').replace(/[^\w-]/g,'_')+'.pdf');toast('Đã tạo file PDF thành công!')}
async function saveSheet(){SNAME=$('#sn').value||'Phiếu mới';try{SID=(await api('POST','worksheets',{id:SID,name:SNAME,json:W})).id;toast('Đã lưu phiếu');tSheet()}catch(x){toast(x.message)}}
function openSh(id,cp){const s=SHEETS.find(x=>x.id==id);W={...DEF(),...JSON.parse(s.json)};SID=cp?null:id;SNAME=cp?s.name+' (bản sao)':s.name;sheetUI();scrollTo(0,0)}
async function delSh(id){if(!confirm('Xóa phiếu này?'))return;await api('DELETE','worksheets?id='+id);if(SID==id)SID=null;tSheet()}
// ===== TRÒ CHƠI NÉT (dùng dữ liệu cấu tạo chữ do giáo viên nhập) =====
const strokeFld=(sel,it)=>sel[0]!='l'?'':`<label>Thứ tự các nét cấu tạo chữ (số 1-14, cách nhau dấu phẩy; dùng cho 3 trò chơi về nét)<input id="cs" value="${esc(it.strokes)}" placeholder="vd: 5,1"></label><div>${STR.map((s,i)=>`<button type="button" title="${esc(s)}" onclick="$('#cs').value+=($('#cs').value?',':'')+${i+1}">${svg(i,28)}${i+1}</button>`).join('')}<button type="button" onclick="$('#cs').value=''">Xóa</button></div>`;
function askT(q){G.t=0;G.lock=0;G.pl=[];shell(snav(),`<div class="card" style="text-align:center"><h3>${GAMES[G.k].n} · Câu ${G.i+1}/${G.qs.length}</h3><h1>${esc(q.p)}</h1><div class="wf" style="font-size:80px">${esc(q.l)}</div><button onclick="say(G.qs[G.i].p)">🔊 NGHE</button><div id="tb"></div><h2 id="fb">&nbsp;</h2></div>`);drawT();say(q.p)}
function drawT(){const q=G.qs[G.i],bd=q.type=='build',sv=n=>svg(n-1,60),n=bd?q.need.length:q.seq.length,
 pool=q.pool.map((v,i)=>G.pl.includes(i)?'':`<button class="opt" style="min-width:0" draggable="true" ondragstart="event.dataTransfer.setData('t','${i}')" onclick="tapT(${i})">${sv(v)}</button>`).join(''),
 slots=Array.from({length:n},(_,s)=>G.pl[s]!==undefined?`<button class="opt" style="min-width:0;background:var(--g)" onclick="unT(${s})">${sv(q.pool[G.pl[s]])}</button>`:`<span style="display:inline-block;width:70px;height:70px;border:3px dashed #aab;border-radius:12px;margin:6px;line-height:70px;color:#aab">${bd?'':s+1}</span>`).join('');
 $('#tb').innerHTML=`<p>${bd?'Kéo (hoặc chạm) các nét vào khung để ghép chữ. Có thể có nét thừa nhé!':'Chạm lần lượt các nét theo thứ tự viết chữ.'}</p><div ondragover="event.preventDefault()" ondrop="tapT(+event.dataTransfer.getData('t'))" style="min-height:90px;border:3px solid var(--b);border-radius:16px;padding:6px">${slots}</div><div style="margin-top:10px">${pool}</div>${bd?'<button class="big" onclick="chkT()">✅ KIỂM TRA</button>':''}`}
function tapT(i){const q=G.qs[G.i];if(G.lock||!(i>=0)||G.pl.includes(i))return;
 if(q.type=='build'){if(G.pl.length<q.need.length)G.pl.push(i)}
 else if(q.pool[i]==q.seq[G.pl.length]){G.pl.push(i);$('#fb').innerHTML='&nbsp;'}
 else{G.t++;$('#fb').textContent='Chưa đúng rồi, con nhớ lại nét viết đầu tiên rồi đến nét tiếp theo nhé! 💪';say('Con thử lại nhé');return}
 drawT();if(q.type=='order'&&G.pl.length==q.seq.length)okQ()}
function unT(s){if(!G.lock&&G.qs[G.i].type=='build'){G.pl.splice(s,1);drawT()}}
function chkT(){const q=G.qs[G.i],a=G.pl.map(i=>q.pool[i]).sort().join(),b=[...q.need].sort().join();if(a==b)okQ();else{G.t++;$('#fb').textContent=G.pl.length<q.need.length?'Con ghép thêm các nét nữa nhé! 💪':'Chưa đúng rồi, con thử đổi các nét nhé! 💪';say('Con thử lại nhé')}}
function okQ(){G.lock=1;if(!G.t)G.s++;$('#fb').textContent='🎉 Giỏi quá!';say('Giỏi quá!');setTimeout(()=>{G.i++;G.i<G.qs.length?ask():endG()},1000)}
// ===== GIÁO VIÊN: TRÒ CHƠI & PHẦN THƯỞNG =====
const bdRow=b=>`<div class="row2 bdr"><input type="number" min="1" value="${b[0]}"><input value="${esc(b[1])}"><input value="${esc(b[2])}" placeholder="Tên huy hiệu"></div>`;
async function tRewards(){S.cfg=await api('GET','config');const C=S.cfg,st=(await api('GET','students')).students;
 shell(tnav(),`<div class="card"><h2>Quản lý trò chơi</h2><div style="overflow:auto"><table><tr><th>Trò chơi</th><th>Bật</th><th>Sao khi hoàn thành (lần đầu)</th><th>Số câu (3-10)</th></tr>${Object.entries(GAMES).map(([k,g])=>{const c=C.games[k];return `<tr><td>${g.n}${g.min&&!SL(g.min).length?' <small class="warn">(chưa có dữ liệu cấu tạo chữ ở mục "Chữ, nét, video")</small>':''}</td><td><input type="checkbox" style="width:auto" id="go${k}" ${c.on?'checked':''}></td><td><input type="number" id="gs${k}" min="0" max="5" value="${c.stars}"></td><td><input type="number" id="gc${k}" min="3" max="10" value="${c.count}"></td></tr>`}).join('')}</table></div></div>
 <div class="card"><h2>Phần thưởng</h2><label>Sao khi hoàn thành một bài học (chữ/nét)<input type="number" id="ls" min="0" max="5" value="${C.rewards.lessonStars}"></label><h3>Huy hiệu (số sao cần có · biểu tượng · tên)</h3><div id="bd">${C.rewards.badges.map(bdRow).join('')}</div><button onclick="$('#bd').insertAdjacentHTML('beforeend',bdRow([50,'🎖','']))">➕ Thêm huy hiệu</button><p><button onclick="saveCfg()">💾 Lưu cấu hình</button></p></div>
 <div class="card"><h2>Tặng sao thủ công</h2><div class="row2"><select id="bu">${st.map(s=>`<option value="${s.id}">${esc(s.display)} (${esc(s.cls)})</option>`).join('')}</select><input id="bn" type="number" min="1" max="10" value="1"><input id="br" placeholder="Lý do (vd: Viết đẹp)"><button onclick="bonus()">🎁 Tặng sao</button></div></div>`)}
async function saveCfg(){const games={};Object.keys(GAMES).forEach(k=>games[k]={on:$('#go'+k).checked,stars:$('#gs'+k).value,count:$('#gc'+k).value});const badges=[...document.querySelectorAll('.bdr')].map(r=>[...r.querySelectorAll('input')].map(i=>i.value));try{await api('PUT','config',{games,rewards:{lessonStars:$('#ls').value,badges}});S.cfg=await api('GET','config');toast('Đã lưu cấu hình');tRewards()}catch(x){toast(x.message)}}
async function bonus(){try{await api('POST','bonus',{uid:$('#bu').value,stars:$('#bn').value,reason:$('#br').value});toast('Đã tặng sao');$('#br').value=''}catch(x){toast(x.message)}}

init();
</script></body></html>
